<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ?v= is a cache-buster. iOS caches a Home Screen icon by URL and keeps
         serving the old artwork even after you delete and re-add the app, so
         bump this whenever the icon art changes. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#0e1121" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Radiant" />
    <title>Radiant</title>
    <script>
      // Paint in the right palette from the very first frame. Every color is
      // defined under :root[data-mode=…], and the real mode only arrives with
      // the config — so without this there's a flash of unstyled page on every
      // launch, and a device that hasn't signed in yet (no config at all) would
      // render the connect screen with no theme whatsoever.
      try { document.documentElement.dataset.mode = localStorage.getItem('radiant.mode') || 'dark' }
      catch (e) { document.documentElement.dataset.mode = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
